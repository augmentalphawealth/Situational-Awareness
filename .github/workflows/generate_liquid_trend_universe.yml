name: Generate Liquid Trend Universe (EMA)

on:
  # Option 1: run manually from the Actions tab
  workflow_dispatch:

  # Option 2: scheduled run (adjust time as needed; this is ~10 min after typical EOD)
  schedule:
    # Runs at 15:45 IST on every trading day (Mon–Fri)
    # GitHub uses UTC; IST = UTC+5:30, so 15:45 IST = 10:15 UTC
    - cron: "15 10 * * 1-5"

jobs:
  generate-universe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate liquid trend universe
        run: |
          python generate_liquid_trend_universe.py

      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@github.com"
          git config --local user.name "github-actions[bot]"

          if ! git diff --quiet liquid_trend_universe.csv tradingview_liquid_trend_universe.txt; then
            git add liquid_trend_universe.csv tradingview_liquid_trend_universe.txt
            git commit -m "Update liquid trend universe (EMA-based) [auto]"
            git push
          else
            echo "No changes to commit"
          fi
