name: Intraday Update

on:
  workflow_dispatch:
  schedule:
    # Runs every 15 minutes during NSE trading hours (08:45 AM – 04:15 PM IST)
    # UTC 3:45–10:00 = IST 9:15 AM–3:30 PM (market hours), with buffer
    - cron: '*/15 3-10 * * 1-5'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run intraday analysis
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_USER_ID: ${{ secrets.KITE_USER_ID }}
          KITE_PASSWORD: ${{ secrets.KITE_PASSWORD }}
          KITE_TOTP: ${{ secrets.KITE_TOTP }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -u analyze_intraday_replacement.py
