name: Download NSE 6M Data

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Run downloader
        run: |
          python phone_copy_nse_6m_script.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: nse-last-6-months-eq
          path: nse_last_6_months_eq.csv
