name: Run Brakes & Ignition Engine Research

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    paths:
      - 'Research/research_brakes_engine.py'
      - 'Research/research_ignition_engine.py'

jobs:
  run-engine-research:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Brakes Engine Research
        working-directory: ./Research
        run: python research_brakes_engine.py

      - name: Run Ignition Engine Research
        working-directory: ./Research
        run: python research_ignition_engine.py

      - name: Commit and Push Summary CSVs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Research/research_brakes_summary.csv Research/research_ignition_summary.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Brakes and Ignition Research Summaries"
          git push
