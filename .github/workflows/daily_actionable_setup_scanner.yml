name: Daily Actionable Setup Scanner

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-write
  cancel-in-progress: false

jobs:
  scan:
    name: Generate actionable setup list from existing EOD parquet
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily actionable setup list
        run: |
          set -euo pipefail
          python -u daily_actionable_setup_scanner.py

      - name: Commit actionable setup list
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily_actionable_setups.csv

          if git diff --cached --quiet; then
            echo "No actionable setup changes to commit."
            exit 0
          fi

          git commit -m "Update daily actionable setup list"
          git push origin HEAD:main
