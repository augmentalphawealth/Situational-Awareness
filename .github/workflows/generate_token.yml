name: Daily Token Rotation

on:
  workflow_dispatch:
  schedule:
    # Runs at 03:00 UTC = 08:30 AM IST, Monday–Friday
    - cron: '0 3 * * 1-5'

jobs:
  rotate-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # CRITICAL: --with-deps installs required Linux GUI libraries for Chromium
          python -m playwright install --with-deps chromium

      - name: Run Token Injector
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_USER_ID: ${{ secrets.KITE_USER_ID }}
          KITE_PASSWORD: ${{ secrets.KITE_PASSWORD }}
          KITE_TOTP: ${{ secrets.KITE_TOTP }}
          GH_PAT: ${{ secrets.GH_PAT }}
          # Exposing GitHub's automatic repository variable to the script
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python -u update_kite_token.py
