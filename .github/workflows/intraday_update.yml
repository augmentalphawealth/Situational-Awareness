name: Intraday Update

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron uses UTC.
    # 03:45–10:00 UTC = 09:15 AM–03:30 PM IST.
    # Runs every 15 minutes on Monday–Friday.
    - cron: "*/15 3-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-write
  cancel-in-progress: false

jobs:
  intraday-update:
    name: Fetch and analyse intraday breadth
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify morning Kite token is available
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${KITE_API_KEY}" ]; then
            echo "❌ KITE_API_KEY is missing."
            exit 1
          fi

          if [ -z "${KITE_API_SECRET}" ]; then
            echo "❌ KITE_API_SECRET is missing."
            exit 1
          fi

          if [ -z "${KITE_ACCESS_TOKEN}" ]; then
            echo "❌ KITE_ACCESS_TOKEN is missing."
            echo "Run Daily Token Rotation first, or verify the KITE_ACCESS_TOKEN Actions secret."
            exit 1
          fi

          echo "✅ Morning-generated Kite access token is available."

      - name: Run intraday analysis
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          INTRADAY_CRITICAL_SYMBOLS: RELIANCE,HDFCBANK,ICICIBANK,INFY,TCS
        run: |
          set -euo pipefail
          python -u analyze_intraday_replacement.py

      - name: Commit and push intraday updates
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files_to_add=()

          for f in live_intraday_aggregate.csv live_intraday_breadth.csv live_intraday.parquet trailing_cache.parquet last_sync.txt intraday_audits; do
            if [ -e "$f" ]; then
              files_to_add+=("$f")
            fi
          done

          if [ ${#files_to_add[@]} -eq 0 ]; then
            echo "No intraday data files found to commit."
            exit 0
          fi

          git add "${files_to_add[@]}"

          if git diff --cached --quiet; then
            echo "No intraday data changes to commit."
            exit 0
          fi

          git commit -m "Auto-update: intraday aggregate and stock data"
          git push origin HEAD:main
