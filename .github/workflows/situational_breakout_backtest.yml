name: Situational Breakout Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow

      - name: Verify historical database
        run: |
          ls -lh nse_6yr_historical.parquet
          test -f nse_6yr_historical.parquet

      - name: Run scanner and two-year event study
        run: python situational_breakout_scanner.py

      - name: Upload scanner outputs
        uses: actions/upload-artifact@v4
        with:
          name: situational-breakout-backtest
          path: |
            situational_breakout_daily.csv
            situational_breakout_trades.csv
            situational_breakout_summary.csv
            situational_breakout_symbol_stats.csv
