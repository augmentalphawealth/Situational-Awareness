name: EOD Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5,17 * * 1-5'

jobs:
  update-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EOD fetch
        run: |
          python fetch_eod_6yr.py
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          EOD_CRITICAL_SYMBOLS: RELIANCE,HDFCBANK,ICICIBANK,INFY,TCS

      - name: Commit and push EOD updates
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add historical_breadth_regime_6yr.csv
          git add trailing_cache.parquet
          git add nse_6yr_historical.parquet
          git commit -m "Auto-update: EOD historical data" || echo "No changes to commit"
          git push