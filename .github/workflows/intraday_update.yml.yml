name: Intraday Update

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: 03:00-10:45 UTC = 08:30-16:15 IST.
    - cron: "*/15 3-10 * * 1-5"

concurrency:
  group: data-sync
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Kolkata

jobs:
  update-intraday:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intraday updater
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python -u fetch_intraday.py

      - name: Validate prepared dashboard data
        run: |
          set -euo pipefail
          test -s dashboard_data.parquet
          test -s live_intraday.parquet
          test -s live_intraday_breadth.csv
          test -s last_sync.txt

          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          import pandas as pd

          path = Path("dashboard_data.parquet")
          df = pd.read_parquet(path)

          required = {"Date", "Symbol", "Close", "Volume"}
          missing = required.difference(df.columns)
          if missing:
              raise SystemExit(f"Missing columns: {sorted(missing)}")

          df["Date"] = pd.to_datetime(df["Date"], errors="coerce").dt.normalize()
          today = pd.Timestamp(datetime.now().date()).normalize()
          rows_today = int((df["Date"] == today).sum())

          if rows_today == 0:
              raise SystemExit(f"dashboard_data.parquet has no rows for {today.date()}")

          print(f"Validated {len(df)} total rows; {rows_today} rows for today")
          PY

      - name: Commit and push generated data
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add dashboard_data.parquet live_intraday.parquet live_intraday_breadth.csv last_sync.txt

          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi

          git commit -m "Auto-update: intraday prepared data"
          git push origin HEAD:main
