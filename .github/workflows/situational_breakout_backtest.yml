name: Strict Dry-Up Active Leader Backtest v3

on:
  workflow_dispatch:
    inputs:
      round_trip_cost_bps:
        description: "Round-trip trading cost assumption (basis points)"
        required: false
        default: "20"
      oos_years:
        description: "Years reserved for out-of-sample validation"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ROUND_TRIP_COST_BPS: ${{ github.event.inputs.round_trip_cost_bps || '20' }}
      OOS_YEARS: ${{ github.event.inputs.oos_years || '2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow

      - name: Verify data files
        run: |
          ls -lh nse_6yr_historical.parquet historical_breadth_regime_6yr.csv
          test -f nse_6yr_historical.parquet
          test -f historical_breadth_regime_6yr.csv

      - name: Validate backtest scripts
        run: |
          python -m py_compile swing_trend_backtest_v2.py swing_trend_backtest_v3.py

      - name: Run strict dry-up backtest v3
        run: python swing_trend_backtest_v3.py

      - name: Upload backtest outputs
        uses: actions/upload-artifact@v4
        with:
          name: strict-dryup-active-leader-backtest-v3
          if-no-files-found: error
          retention-days: 14
          path: |
            strict_dryup_v3_setups.csv
            strict_dryup_v3_trades.csv
            strict_dryup_v3_strategy_comparison.csv
            strict_dryup_v3_yearly.csv
            strict_dryup_v3_symbol_results.csv
            strict_dryup_v3_parameter_stability.csv
            strict_dryup_v3_recommended_candidates.csv
            strict_dryup_v3_concentration.csv
            strict_dryup_v3_notes.txt
