name: Intraday Update

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 9-15 * * 1-5'

jobs:
  update-intraday:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intraday analysis
        run: |
          python intraday_engine.py
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}

      - name: Commit and push intraday updates
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add intraday_tmp/*.json
          git add intraday_tmp/*.parquet
          git add live_intraday_breadth.csv
          git add last_sync.txt
          git commit -m "Auto-update: intraday aggregate and stock data" || echo "No changes to commit"
          git push