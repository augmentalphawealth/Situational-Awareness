name: Run Breakout Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow

      - name: Run research backtest
        run: |
          python Research/backtest_breakout_regime.py

      - name: Commit all research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Research/*.csv
          git commit -m "Update research backtest outputs" || echo "No output changes"
          git push
